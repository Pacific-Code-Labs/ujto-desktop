name: Build and release

# Signing is off until configured (repository Settings → Secrets and variables → Actions):
#   macOS    vars.MACOS_SIGNING = "true" + secrets MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
#            and notarization: APPLE_API_KEY_P8 (key contents), APPLE_API_KEY_ID, APPLE_API_ISSUER
#            — or APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID.
#   Windows  vars.WINDOWS_SIGNING = "signpath" (free for open source, SignPath Foundation):
#              secrets SIGNPATH_API_TOKEN; vars SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG,
#              SIGNPATH_SIGNING_POLICY_SLUG (e.g. release-signing)
#            or "azure" (Azure Artifact Signing, paid):
#              secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET; vars AZURE_SIGNING_ENDPOINT
#              (e.g. https://eus.codesigning.azure.net/), AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
#   Linux    no signing needed.
#
# Microsoft Store: every Windows build also produces two MSIX packages (unsigned: the Store signs):
#   Ujto-windows-x64.msix        full edition (on-device link downloads)
#   Ujto-windows-x64-store.msix  store edition (no downloader; Store policy friendly)
# Identity from Partner Center → vars MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY_NAME.
# Optional automatic draft submission on tags: vars MSSTORE_PUBLISH="true", MSSTORE_APP_ID,
# MSSTORE_EDITION ("store" default | "full"); secrets PARTNER_CENTER_TENANT_ID, PARTNER_CENTER_SELLER_ID,
# PARTNER_CENTER_CLIENT_ID, PARTNER_CENTER_CLIENT_SECRET.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1" # Mondays: check for a new yt-dlp (YouTube breaks old versions)

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: mac-arm64 }
          - { os: macos-15-intel, name: mac-x64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: ubuntu-22.04, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux GTK/WebKit build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-webkit2-4.1 libwebkit2gtk-4.1-dev libfuse2
          pip install "PyGObject<3.51" pycairo
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      - name: macOS signing keychain
        if: runner.os == 'macOS' && vars.MACOS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$IDENTITY" ] || { echo "No Developer ID Application identity in MACOS_CERT_P12" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY_P8" ]; then
            echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      - name: Build app and installer
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: PYTHON=python bash scripts/build.sh

      # Azure signs the app's own .exe before it goes into the installer, then the installer.
      - name: Sign Ujto.exe (Azure Artifact Signing)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'azure'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\dist\Ujto\Ujto.exe
          file-digest: SHA256
          timestamp-digest: SHA256

      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:UJTO_VERSION = python -c "import ujto_desktop; print(ujto_desktop.__version__)"
          iscc packaging\windows\ujto.iss

      - name: Sign installer (Azure Artifact Signing)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'azure'
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\dist\Ujto-windows-x64.exe
          file-digest: SHA256
          timestamp-digest: SHA256

      # SignPath: upload the unsigned installer, SignPath signs it (its policy can also sign
      # the files inside), and the signed file replaces the unsigned one.
      - name: Upload unsigned installer for SignPath
        id: unsigned
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'signpath'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: dist/Ujto-windows-x64.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'signpath'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Use the signed installer
        if: runner.os == 'Windows' && vars.WINDOWS_SIGNING == 'signpath'
        shell: pwsh
        run: Move-Item -Force dist\signed\Ujto-windows-x64.exe dist\Ujto-windows-x64.exe

      - name: MSIX packages for the Microsoft Store (full + store editions)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        run: |
          pwsh scripts/build-msix.ps1 -Edition full
          # Rebuild without the downloader for the store edition (overwrites dist\Ujto).
          $env:UJTO_EDITION = "store"
          python -m PyInstaller --noconfirm --clean packaging/ujto.spec
          pwsh scripts/build-msix.ps1 -Edition store

      - name: Upload MSIX packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ujto-msstore
          path: dist/*.msix
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ujto-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Platform installers only (ujto-mac-arm64, ujto-windows-x64, …); the MSIX packages
          # (ujto-msstore) are for the Microsoft Store, not for direct download.
          pattern: ujto-*-*
          merge-multiple: true
      # Stable asset names, so releases/latest/download/<name> links never change.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* -R "${GITHUB_REPOSITORY}" \
            --title "Ujtö̀ ${GITHUB_REF_NAME}" --generate-notes

  msstore:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.MSSTORE_PUBLISH == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ujto-msstore
          path: msstore
      - name: Keep the chosen edition only
        shell: pwsh
        run: |
          $edition = if ("${{ vars.MSSTORE_EDITION }}") { "${{ vars.MSSTORE_EDITION }}" } else { "store" }
          $keep = if ($edition -eq "store") { "Ujto-windows-x64-store.msix" } else { "Ujto-windows-x64.msix" }
          New-Item -ItemType Directory -Force upload | Out-Null
          Move-Item "msstore\$keep" upload\
          Get-ChildItem upload
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Draft submission in Partner Center (review and submit there)
        run: |
          msstore reconfigure --tenantId ${{ secrets.PARTNER_CENTER_TENANT_ID }} --sellerId ${{ secrets.PARTNER_CENTER_SELLER_ID }} --clientId ${{ secrets.PARTNER_CENTER_CLIENT_ID }} --clientSecret ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          msstore publish upload --inputDirectory upload --appId ${{ vars.MSSTORE_APP_ID }} --noCommit

  ytdlp-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open a PR when yt-dlp has a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(curl -fsSL https://pypi.org/pypi/yt-dlp/json | python3 -c 'import json,sys;print(json.load(sys.stdin)["info"]["version"])')
          pinned=$(sed -n 's/^yt-dlp\[default\]==//p' requirements.txt)
          echo "pinned=$pinned latest=$latest"
          [ "$latest" = "$pinned" ] && exit 0
          branch="yt-dlp-$latest"
          git ls-remote --exit-code --heads origin "$branch" && exit 0
          sed -i "s/^yt-dlp\[default\]==.*/yt-dlp[default]==$latest/" requirements.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Bump yt-dlp to $latest"
          git push origin "$branch"
          gh pr create --title "Bump yt-dlp to $latest" --body "YouTube changes break older yt-dlp releases. Merge, bump the app version in ujto_desktop/__init__.py and tag a release to ship new installers."
